services:
  - type: web
    name: deal-structure-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 65 hosted:application
    healthCheckPath: /healthz
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
